# Orion OS : réponses préenregistrées de l'installateur Debian (entrée
# « Install » / « Graphical install » du menu de démarrage de l'image).
# L'installateur copie le système de l'image sur le disque, puis crée
# l'utilisateur « orion » (seul son mot de passe est demandé).
# Restent posées : le disque à utiliser et la confirmation avant d'écrire dessus.

# Langue, pays, clavier
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

# Réseau (facultatif pendant l'installation : tout est déjà dans l'image)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string orion
d-i netcfg/get_domain string
d-i netcfg/hostname string orion
d-i hw-detect/load_firmware boolean true

# Dépôts Debian (mises à jour de sécurité automatiques après l'installation)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false

# Comptes : root verrouillé (comme sur un téléphone : l'utilisateur orion
# pilote le matériel grâce à polkit), utilisateur « orion » dont seul le mot
# de passe est demandé. « * » verrouille root sans poser de question et sans
# installer sudo.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Orion
d-i passwd/username string orion
d-i passwd/user-default-groups string audio cdrom dip video render input plugdev netdev bluetooth dialout systemd-journal

# Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

# Partitionnement guidé, disque entier, une seule partition ext4 (+ partition
# EFI ou d'amorçage BIOS selon la machine). Le disque est demandé, et
# l'écriture doit être confirmée.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/default_filesystem string ext4

# Rien d'autre à installer : le système vient de l'image
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Chargeur d'amorçage (BIOS ou UEFI, détecté par l'installateur)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Fin : redémarrage direct sur Orion
d-i finish-install/reboot_in_progress note
