function body(p) {
  // Avertissement de contenu (fédivers) : le texte et les médias restent cachés jusqu'au toucher.
  if (p.cw && !ui.opened.has(p.id)) return `<div class="cw"><span>⚠️ ${esc(p.cw)}</span><button class="pill-btn ghost small" data-act="cw" data-id="${p.id}">Afficher</button></div>`;
  if (p.bg != null && GRADIENTS[p.bg]) return `<div class="bgcard" data-act="open" data-id="${p.id}" style="background:${GRADIENTS[p.bg]}">${rich(p.text)}</div>`;
  const text = p.text ? `<div class="post-text" data-act="open" data-id="${p.id}">${rich(p.text, p.mentions)}${p.edited ? ' <span class="edited">· modifié</span>' : ''}</div>` : '';
  return text + mediaHtml(p);
}
function mediaHtml(p) {
  if (!p.media?.length) return '';
  const veiled = p.sensitive && !ui.opened.has(`${p.id}:media`);
  const items = p.media.slice(0, 4).map((m, i) => {
    const label = { gifv: 'GIF', video: '▶ Vidéo', audio: '♪ Audio' }[m.type];
    return `<button class="media-item" data-act="media" data-id="${p.id}" data-i="${i}" aria-label="${esc(m.alt || 'Média')}">${m.type !== 'audio' && m.preview ? `<img data-src="${esc(m.preview)}" alt="${esc(m.alt)}">` : ''}${label ? `<span class="media-badge">${label}</span>` : ''}</button>`;
  });
  return `<div class="media n${Math.min(4, p.media.length)}${veiled ? ' veiled' : ''}">${items.join('')}${veiled ? `<button class="media-veil" data-act="unveil" data-id="${p.id}">Contenu sensible · toucher pour afficher</button>` : ''}</div>`;
}
function quoteHtml(p) {
  if (!p.quoteOf) return '';
  const q = find(p.quoteOf);
  if (!q || hidden(q)) return '<div class="quote muted">Cette publication n\'est plus disponible.</div>';
  return `<button class="quote" data-act="open" data-id="${q.id}"><span class="post-who">${avatar(q.author, 18)} <b>${esc(nameOf(q.author))}</b><span>@${q.author} · ${ago(q.at)}</span></span><span class="q-text">${esc(q.text)}</span></button>`;
}
function timeLeft(ts) {
  const d = ts - Date.now();
  if (d < HOUR) return `${Math.max(1, Math.ceil(d / MINUTE))} min`;
  if (d < DAY) return `${Math.ceil(d / HOUR)} h`;
  return `${Math.ceil(d / DAY)} j`;
}
function pollHtml(p) {
  const poll = p.poll;
  if (!poll) return '';
  const total = poll.options.reduce((s, o) => s + o.votes, 0);
  const ended = Date.now() > poll.ends;
  const done = ended || poll.mine != null || isMe(p.author);
  const options = poll.options.map((o, i) => {
    if (!done) return `<button class="poll-opt" data-act="vote" data-id="${p.id}" data-option="${i}"><span>${esc(o.text)}</span></button>`;
    const pct = total ? Math.round((o.votes * 100) / total) : 0;
    return `<div class="poll-opt${poll.mine === i ? ' mine' : ''}"><i style="width:${pct}%"></i><span>${esc(o.text)}${poll.mine === i ? ' ✓' : ''}</span><b>${pct} %</b></div>`;
  });
  return `<div class="poll${done ? ' done' : ''}">${options.join('')}<div class="poll-meta">${plural(total, 'vote', 'votes')} · ${ended ? 'Terminé' : `encore ${timeLeft(poll.ends)}`}</div></div>`;
}
function actionsHtml(p) {
  const saved = marked(p.id);
  return `<div class="actions">
    <button class="act" data-act="reply" data-id="${p.id}" aria-label="Répondre">${icon('reply', 18)}<span>${count(repliesTo(p.id))}</span></button>
    <button class="act repost${p.reposted ? ' on' : ''}" data-act="repost" data-id="${p.id}" aria-label="Partager">${icon('repost', 18)}<span>${count(p.reposts)}</span></button>
    <button class="act like${p.liked ? ' on' : ''}" data-act="like" data-id="${p.id}" aria-label="J'aime" aria-pressed="${Boolean(p.liked)}">${icon(p.liked ? 'heartFill' : 'heart', 18)}<span>${count(p.likes)}</span></button>
    <button class="act mark${saved ? ' on' : ''}" data-act="bookmark" data-id="${p.id}" aria-label="${saved ? 'Retirer des enregistrements' : 'Enregistrer'}">${icon(saved ? 'markFill' : 'mark', 18)}</button>
  </div>`;
}
const who = (handle, extra = '') => `<button class="post-who" data-act="profile" data-user="${handle}"><b>${esc(nameOf(handle))}</b>${badge(handle)}<span>@${handle}${extra}</span></button>`;

/** Une publication dans une liste (`entry` peut être un partage). */
function postCard(entry, { line = false, pinned = false } = {}) {
  const p = original(entry);
  if (!p) return '';
  const context = entry.repostOf
    ? `<div class="post-ctx">${icon('repost', 14)} ${isMe(entry.author) ? 'Vous avez partagé' : `${esc(nameOf(entry.author))} a partagé`}</div>`
    : pinned ? `<div class="post-ctx">${icon('pin', 14)} Épinglé</div>` : '';
  const replied = p.replyTo && find(p.replyTo);
  return `<article class="post" data-card="${p.id}" data-entry="${entry.id}"${pinned ? ' data-pinned="1"' : ''}${line ? ' data-line="1"' : ''}>
    <div class="post-side"><button data-act="profile" data-user="${p.author}" aria-label="Profil de ${esc(nameOf(p.author))}">${avatar(p.author, 42)}</button>${line ? '<div class="thread-line"></div>' : ''}</div>
    <div class="post-main">${context}
      <div class="post-head">${who(p.author, ` · ${ago(p.at)}`)}<button class="post-more" data-act="more" data-id="${p.id}" aria-label="Plus">${icon('more', 18)}</button></div>
      ${replied && !line && !entry.repostOf ? `<div class="post-reply-to">En réponse à <a data-act="profile" data-user="${replied.author}">@${replied.author}</a></div>` : ''}
      ${body(p)}${quoteHtml(p)}${pollHtml(p)}${actionsHtml(p)}
    </div>
  </article>`;
}

/** La publication ouverte, en grand. */
function detailCard(p) {
  const likers = (p.likedBy || []).filter((h) => person(h));
  const others = Math.max(0, (p.likes || 0) - likers.length - (p.liked ? 1 : 0));
  const names = [...(p.liked ? ['vous'] : []), ...likers.slice(0, 2).map(nameOf)];
  const rest = (p.liked ? 1 : 0) + likers.length - names.length + others;
  return `<article class="detail" data-card="${p.id}" data-entry="${p.id}" data-detail="1">
    <div class="post-head" style="gap:10px"><button data-act="profile" data-user="${p.author}">${avatar(p.author, 46)}</button>${who(p.author)}<button class="post-more" data-act="more" data-id="${p.id}" aria-label="Plus">${icon('more', 18)}</button></div>
    ${p.replyTo && find(p.replyTo) ? `<div class="post-reply-to">En réponse à <a data-act="profile" data-user="${find(p.replyTo).author}">@${find(p.replyTo).author}</a></div>` : ''}
    <div style="margin-top:8px">${body(p)}</div>${quoteHtml(p)}${pollHtml(p)}
    <div class="detail-date">${fullDate(p.at)}${p.edited ? ' · modifié' : ''}</div>
    ${p.likes || p.reposts ? `<div class="detail-stats">${p.reposts ? `<span><b>${compact(p.reposts)}</b>${p.reposts > 1 ? 'partages' : 'partage'}</span>` : ''}${p.likes ? `<span><b>${compact(p.likes)}</b>J'aime</span>` : ''}</div>` : ''}
    ${names.length ? `<div class="detail-date">Aimé par ${esc(names.join(', '))}${rest > 0 ? ` et ${plural(rest, 'autre personne', 'autres personnes')}` : ''}</div>` : ''}
    ${actionsHtml(p)}
  </article>`;
}

const moreButton = (total) => (total > ui.shown ? '<button class="more-btn" data-act="more-posts">Afficher plus</button>' : '');
const followButton = (handle, small = true) => (isMe(handle) ? '' : following(handle)
  ? `<button class="pill-btn ghost${small ? ' small' : ''}" data-act="follow" data-user="${handle}">${online() && !relation(handle).following ? 'Demande envoyée' : 'Abonné·e'}</button>`
  : `<button class="pill-btn${small ? ' small' : ''}" data-act="follow" data-user="${handle}">${followsMe(handle) ? 'Suivre en retour' : 'Suivre'}</button>`);
function personRow(handle, { bio = true } = {}) {
  const p = person(handle);
  if (!p) return '';
  return `<div class="person"><button data-act="profile" data-user="${handle}" aria-label="Profil">${avatar(handle, 46)}</button>
    <button class="who" data-act="profile" data-user="${handle}"><b>${esc(p?.name || handle)}${badge(handle)}</b><span>@${handle}${followsMe(handle) ? ' · vous suit' : ''}</span>${bio && p.bio ? `<p>${esc(p.bio)}</p>` : ''}</button>${followButton(handle)}</div>`;
}
const suggestions = (n = 4) => (online() ? (fedi.suggest || []).filter((h) => !following(h)) : shuffle(PEOPLE.filter((p) => !state.follows.includes(p.handle))).map((p) => p.handle)).slice(0, n).map((h) => personRow(h)).join('');

const VIEWS = {
  loading: () => '<div class="empty">Chargement…</div>',

  home() {
    const list = feed(ui.feed);
    const dms = unreadDms();
    const entry = online() && fedi.lists.get(ui.feed === 'foryou' ? 'trending' : 'home');
    const waiting = online() && listState(entry, ui.feed === 'following' ? 'Votre fil est vide : suivez des comptes depuis Explorer.' : 'Rien de populaire pour le moment.');
    const content = waiting || (list.length
      ? online() ? list.map((p) => postCard(p)).join('') + moreRemote(entry) : list.slice(0, ui.shown).map((p) => postCard(p)).join('') + moreButton(list.length)
      : ui.feed === 'following'
        ? empty('Votre fil est vide', 'Suivez des personnes pour voir leurs publications ici.') + suggestions() + `<div class="empty" style="padding-top:12px"><button class="pill-btn" data-act="feed" data-feed="foryou">Découvrir « Pour vous »</button></div>`
        : empty('Rien pour le moment', 'Revenez dans un instant.'));
    return `<header class="bar"><div class="logo">agora<span>.</span>${online() ? `<small class="instance">${esc(fedi.account.domain)}</small>` : ''}</div><button class="ibtn" data-act="messages" aria-label="Messages">${icon('chat', 23)}${dms ? `<span class="badge">${dms}</span>` : ''}</button></header>
      <div class="seg"><button data-act="feed" data-feed="following" aria-pressed="${ui.feed === 'following'}">Abonnements</button><button data-act="feed" data-feed="foryou" aria-pressed="${ui.feed === 'foryou'}">${online() ? 'Tendances' : 'Pour vous'}</button></div>
      <main class="scroll">${freshPill()}${content}</main>${tabs()}`;
  },

  explore() {
    if (online()) loadExplore();
    return `<header class="bar"><label class="search">${icon('search', 18)}<input id="q" data-keep type="search" enterkeyhint="search" placeholder="${online() ? `Rechercher sur ${esc(fedi.account.domain)} et au-delà` : 'Rechercher sur Agora'}" autocomplete="off" value="${esc(ui.query)}"></label></header>
      <main class="scroll" id="explore">${exploreContent()}</main>${tabs()}`;
  },

  tag() {
    const tag = ui.params.tag;
    if (online()) {
      const entry = listOf(`tag:${tag}`);
      const list = entry.ids.map(find).filter((p) => p && !hidden(p));
      return `${header(`#${esc(tag)}`)}<main class="scroll">${listState(entry, 'Aucune publication avec ce mot-dièse.') || list.map((p) => postCard(p)).join('') + moreRemote(entry)}</main>${tabs()}`;
    }
    const list = state.posts.filter((p) => !p.repostOf && !hidden(p) && tagsOf(p.text).includes(tag)).sort((a, b) => b.at - a.at);
    return `${header(`#${esc(tag)}`, { sub: plural(list.length, 'publication', 'publications') })}
      <main class="scroll">${list.length ? list.slice(0, ui.shown).map((p) => postCard(p)).join('') + moreButton(list.length) : empty('Aucune publication', 'Soyez la première personne à utiliser ce mot-dièse.')}</main>${tabs()}`;
  },

  notifs() {
    if (online()) {
      const entry = listOf('notifs');
      const list = (entry.items || []).filter((n) => !n.actors.some((a) => state.settings.mutedUsers.includes(a)));
      return `${header('Notifications', { left: spacer })}<main class="scroll">${listState(entry, 'Les j\'aime, réponses et abonnements apparaîtront ici.') || list.map(notifRow).join('') + moreRemote(entry)}</main>${tabs()}`;
    }
    const list = state.notifs.filter((n) => !n.actors.some((a) => state.settings.mutedUsers.includes(a)));
    return `${header('Notifications', { left: spacer })}
      <main class="scroll">${list.length ? list.map(notifRow).join('') : empty('Aucune notification', 'Les j\'aime, réponses et abonnements apparaîtront ici.')}</main>${tabs()}`;
  },

  profile() {
    const handle = ui.params.user || me();
    const p = person(handle);
    // Fédivers : profil et relation chargés à la demande.
    if (online() && (!p || p.partial || (!isMe(handle) && !fedi.relations.has(handle)))) once(`lookup:${handle}`, () => lookup(handle));
    if (!p) return `${header('Profil')}<main class="scroll">${online() ? '<div class="empty"><span class="spinner"></span></div>' : empty('Profil introuvable')}</main>${tabs()}`;
    const mine = isMe(handle);
    const root = !stack.length && ui.tab === 'me';
    const right = mine ? `<button class="ibtn" data-act="settings" aria-label="Réglages">${icon('gear', 22)}</button>` : `<button class="ibtn" data-act="profile-more" data-user="${handle}" aria-label="Plus">${icon('more', 22)}</button>`;
    const sections = mine ? [['posts', 'Publications'], ['replies', 'Réponses'], ['likes', 'J\'aime'], ['saved', 'Enregistrés']] : [['posts', 'Publications'], ['replies', 'Réponses']];
    const tab = sections.some(([id]) => id === ui.profileTab) ? ui.profileTab : 'posts';
    let list;
    let pinned = null;
    let entry = null;
    if (online()) {
      entry = p.id ? listOf({ posts: `posts:${p.id}`, replies: `replies:${p.id}`, likes: 'likes', saved: 'saved' }[tab]) : null;
      list = (entry?.ids || []).map(find).filter((x) => x && !hidden(x));
    } else if (tab === 'posts') {
      list = postsBy(handle);
      pinned = mine && state.profile.pinned ? find(state.profile.pinned) : null;
      if (pinned) list = list.filter((x) => x.id !== pinned.id);
    } else if (tab === 'replies') list = repliesBy(handle);
    else if (tab === 'likes') list = state.posts.filter((x) => x.liked && !hidden(x)).sort((a, b) => b.at - a.at);
    else list = state.bookmarks.map(find).filter((x) => x && !hidden(x)).reverse();
    const emptyText = { posts: mine ? 'Vos publications apparaîtront ici.' : 'Rien de publié pour le moment.', replies: 'Aucune réponse.', likes: 'Touchez ♥ pour retrouver une publication ici.', saved: 'Touchez le signet d\'une publication pour la garder ici.' }[tab];
    const actions = mine
      ? '<button class="pill-btn ghost" data-act="edit-profile">Modifier le profil</button>'
      : `<span style="display:flex;gap:8px"><button class="pill-btn ghost" data-act="chat" data-user="${handle}" aria-label="Message">${icon('chat', 18)}</button>${followButton(handle, false)}</span>`;
    const stat = (n, label, list) => (mine && list && (!online() || p.id) ? `<button data-act="people" data-list="${list}"><b>${compact(n)}</b> ${label}</button>` : `<span class="muted"><b style="color:var(--fg)">${compact(n)}</b> ${label}</span>`);
    return `${header(esc(p.name), { left: root ? spacer : backBtn(), right, sub: plural(postCount(handle), 'publication', 'publications') })}
      <main class="scroll">
        <div class="cover" style="background:${GRADIENTS[p.cover] || GRADIENTS[0]}">${p.header ? `<img class="cover-img" data-src="${esc(p.header)}" alt="">` : ''}</div>
        <div class="profile-top">${avatarOf(p, 84)}${actions}</div>
        <div class="profile-info">
          <h2>${esc(p.name)}${badge(handle)}</h2>
          <div class="handle">@${handle}${!mine && followsMe(handle) ? '<span class="follows-you">Vous suit</span>' : ''}</div>
          ${p.bio ? `<p class="bio rich">${rich(p.bio)}</p>` : ''}${p.locked ? '<div class="muted" style="margin-top:6px;font-size:14px">🔒 Compte privé : il accepte ses abonnés</div>' : ''}
          <div class="profile-meta">${p.place ? `<span>📍 ${esc(p.place)}</span>` : ''}<span>${icon('calendar', 14).replace('<svg', '<svg style="display:inline;vertical-align:-2px"')} Membre depuis ${since(p.since)}</span></div>
          <div class="stats">${stat(followingCount(handle), 'abonnements', 'following')}${stat(followerCount(handle), followerCount(handle) > 1 ? 'abonnés' : 'abonné', 'followers')}</div>
        </div>
        <div class="seg">${sections.map(([id, label]) => `<button data-act="profile-tab" data-tab="${id}" aria-pressed="${tab === id}">${label}</button>`).join('')}</div>
        ${pinned && !hidden(pinned) ? postCard(pinned, { pinned: true }) : ''}
        ${online() ? listState(entry, emptyText) || list.map((x) => postCard(x, { pinned: x.pinned && tab === 'posts' })).join('') + moreRemote(entry) : list.length ? list.slice(0, ui.shown).map((x) => postCard(x)).join('') + moreButton(list.length) : pinned ? '' : empty('', emptyText)}
      </main>${tabs()}`;
  },

  people() {
    const following = ui.params.list === 'following';
    if (online()) {
      const entry = listOf(`${ui.params.list}:${fedi.account.me.id}`);
      return `${header(following ? 'Abonnements' : 'Abonnés')}<main class="scroll">${listState(entry, following ? 'Vous ne suivez personne pour le moment.' : 'Personne ne vous suit encore.') || entry.ids.map((h) => personRow(h)).join('') + moreRemote(entry)}</main>${tabs()}`;
    }
    const list = following ? state.follows : state.followers;
    return `${header(following ? 'Abonnements' : 'Abonnés')}
      <main class="scroll">${list.length ? list.filter((h) => person(h)).map((h) => personRow(h)).join('') : empty('', following ? 'Vous ne suivez personne pour le moment.' : 'Personne ne vous suit encore.')}</main>${tabs()}`;
  },

  post() {
    const p = find(ui.params.id);
    const loading = online() && !fedi.contexts.has(ui.params.id);
    if (loading) once(`context:${ui.params.id}`, () => loadContext(ui.params.id));
    if (!p && loading) return `${header('Publication')}<main class="scroll"><div class="empty"><span class="spinner"></span></div></main>`;
    if (!p || hidden(p)) return `${header('Publication')}<main class="scroll">${empty('Publication indisponible', 'Elle a été supprimée ou masquée.')}</main>`;
    const chain = ancestors(p).filter((x) => !hidden(x));
    const replies = thread(p.id);
    return `${header('Publication')}
      <main class="scroll">${chain.map((x) => postCard(x, { line: true })).join('')}${detailCard(p)}${replies.map((r) => postCard(r)).join('') || (loading ? '<div class="empty"><span class="spinner"></span></div>' : empty('', 'Aucune réponse pour le moment.'))}</main>
      <div class="composer"><textarea id="reply-text" data-keep rows="1" maxlength="${maxText()}" placeholder="Répondre à @${p.author}…"></textarea><button class="send" data-act="send-reply" aria-label="Publier la réponse">${icon('send', 18)}</button></div>`;
  },

  compose() {
    const d = state.draft;
    const target = find(d.replyTo || d.quoteOf);
    const title = d.edit ? 'Modifier' : d.replyTo ? 'Répondre' : d.quoteOf ? 'Citer' : 'Nouvelle publication';
    const bg = d.bg != null && !d.poll && !online();
    // Le fond coloré n'existe pas sur le fédivers.
    const canStyle = !d.poll && !d.replyTo && !d.quoteOf && !online();
    return `<header class="bar"><button class="link" data-act="cancel-compose">Annuler</button><div class="bar-title">${title}</div><button class="pill-btn small" id="publish" data-act="publish">${d.edit ? 'Enregistrer' : d.replyTo ? 'Répondre' : 'Publier'}</button></header>
      <main class="scroll">
        ${d.replyTo && target ? `<div class="compose-parent">En réponse à <b>@${target.author}</b><div class="q-text">${esc(target.text)}</div></div>` : ''}
        <div class="compose">${avatar(me(), 42)}<textarea id="c-text" data-keep placeholder="${d.replyTo ? 'Votre réponse' : d.poll ? 'Posez votre question' : 'Quoi de neuf ?'}">${esc(d.text)}</textarea></div>
        <div class="suggest" id="suggest"></div>
        ${bg ? `<div style="padding:0 14px 12px"><div class="bgcard" id="bg-preview" style="background:${GRADIENTS[d.bg]}">${esc(d.text) || 'Votre texte ici'}</div></div>` : ''}
        ${d.palette && canStyle ? `<div class="swatches"><button class="swatch none" data-act="bg" data-bg="" aria-pressed="${d.bg == null}" aria-label="Sans fond">${icon('close', 16)}</button>${GRADIENTS.map((g, i) => `<button class="swatch" data-act="bg" data-bg="${i}" style="background:${g}" aria-pressed="${d.bg === i}" aria-label="Fond ${i + 1}"></button>`).join('')}</div>` : ''}
        ${d.quoteOf && target ? `<div style="padding:0 14px 12px 66px">${quoteHtml({ quoteOf: d.quoteOf })}</div>` : ''}
        ${d.poll ? pollEditor(d.poll) : ''}
      </main>
      <div class="tools">
        <button class="ibtn" data-act="toggle-palette" aria-label="Fond coloré" aria-pressed="${Boolean(d.palette && canStyle)}"${canStyle && !d.edit ? '' : ' disabled'}>${icon('palette', 22)}</button>
        <button class="ibtn" data-act="toggle-poll" aria-label="Sondage" aria-pressed="${Boolean(d.poll)}"${d.replyTo || d.quoteOf || d.edit ? ' disabled' : ''}>${icon('poll', 22)}</button>
        <button class="ibtn" data-act="insert" data-text="#" aria-label="Mot-dièse">${icon('hash', 22)}</button>
        <button class="ibtn" data-act="insert" data-text="@" aria-label="Mention" style="font-size:20px;font-weight:600;color:var(--accent)">@</button>
        <span class="counter" id="counter"></span>
      </div>`;
  },

  messages() {
    if (online()) {
      if (!fedi.convs) once('convs', loadConvs);
      const rows = (fedi.convs || []).map((c) => {
        const last = find(c.last);
        const h = c.accounts[0];
        return `<button class="person" data-act="chat" data-user="${esc(h)}" data-conv="${c.id}">${avatar(h, 50)}<span class="who"><b>${esc(c.accounts.map(nameOf).join(', '))}</b><p style="${c.unread ? 'color:var(--fg);font-weight:600' : ''}">${last && isMe(last.author) ? 'Vous : ' : ''}${esc(last ? dmBody(last) : '')}</p></span><span class="muted" style="font-size:13px">${last ? ago(last.at) : ''}</span>${c.unread ? '<span class="dot"></span>' : ''}</button>`;
      });
      const body = !fedi.convs ? '<div class="empty"><span class="spinner"></span></div>' : rows.length ? rows.join('') : empty('Aucun message', fedi.convsError ? esc(fedi.convsError) : 'Les messages privés du fédivers (visibles seulement par les personnes mentionnées) apparaissent ici.', '<button class="pill-btn" data-act="new-dm">Nouveau message</button>');
      return `${header('Messages', { right: `<button class="ibtn" data-act="new-dm" aria-label="Nouveau message">${icon('edit', 22)}</button>` })}<main class="scroll">${body}</main>`;
    }
    const list = Object.keys(state.dms).filter((h) => state.dms[h].length && person(h)).sort((a, b) => state.dms[b].at(-1).at - state.dms[a].at(-1).at);
    const rows = list.map((h) => {
      const last = state.dms[h].at(-1);
      const unread = !last.me && last.at > (state.dmRead[h] || 0);
      return `<button class="person" data-act="chat" data-user="${h}">${avatar(h, 50)}<span class="who"><b>${esc(nameOf(h))}${badge(h)}</b><p style="${unread ? 'color:var(--fg);font-weight:600' : ''}">${last.me ? 'Vous : ' : ''}${esc(last.text)}</p></span><span class="muted" style="font-size:13px">${ago(last.at)}</span>${unread ? '<span class="dot"></span>' : ''}</button>`;
    });
    return `${header('Messages', { right: `<button class="ibtn" data-act="new-dm" aria-label="Nouveau message">${icon('edit', 22)}</button>` })}
      <main class="scroll">${rows.length ? rows.join('') : empty('Aucun message', 'Écrivez à un membre d\'Agora : il vous répondra.', '<button class="pill-btn" data-act="new-dm">Nouveau message</button>')}</main>`;
  },

  chat() {
    const handle = ui.params.user;
    if (online()) {
      const conv = chatConv();
      if (conv && !fedi.contexts.has(conv.last)) once(`context:${conv.last}`, () => loadContext(conv.last));
      let previous = 0;
      const bubbles = chatPosts(conv).map((m) => {
        const stamp = m.at - previous > HOUR ? `<div class="stamp">${fullDate(m.at)}</div>` : '';
        previous = m.at;
        return `${stamp}<div class="bubble${isMe(m.author) ? ' me' : ''}">${esc(dmBody(m))}</div>`;
      });
      const p = person(handle);
      return `<header class="bar">${backBtn()}<button class="bar-title" data-act="profile" data-user="${esc(handle)}" style="display:flex;align-items:center;justify-content:center;gap:8px">${avatar(handle, 30)}<span style="text-align:left">${esc(p?.name || handle)}<small>@${esc(handle)}</small></span></button>${spacer}</header>
        <main class="scroll"><div class="bubbles">${bubbles.join('') || `<div class="empty" style="padding:40px 20px">${avatar(handle, 64)}<b>${esc(p?.name || handle)}</b><span>Message privé : visible seulement par @${esc(handle)} et vous (et par les administrateurs des instances).</span></div>`}</div></main>
        <div class="composer"><textarea id="dm-text" data-keep rows="1" maxlength="1000" placeholder="Message privé"></textarea><button class="send" data-act="send-dm" aria-label="Envoyer">${icon('send', 18)}</button></div>`;
    }
    const messages = state.dms[handle] || [];
    let previous = 0;
    const bubbles = messages.map((m) => {
      const stamp = m.at - previous > HOUR ? `<div class="stamp">${fullDate(m.at)}</div>` : '';
      previous = m.at;
      return `${stamp}<div class="bubble${m.me ? ' me' : ''}">${esc(m.text)}</div>`;
    });
    const typing = state.sim.queue.some((e) => e.type === 'dm' && e.actor === handle);
    const p = person(handle);
    return `<header class="bar">${backBtn()}<button class="bar-title" data-act="profile" data-user="${handle}" style="display:flex;align-items:center;justify-content:center;gap:8px">${avatar(handle, 30)}<span style="text-align:left">${esc(p?.name || handle)}<small>@${handle}</small></span></button>${spacer}</header>
      <main class="scroll"><div class="bubbles">${bubbles.join('') || `<div class="empty" style="padding:40px 20px">${avatar(handle, 64)}<b>${esc(p?.name || handle)}</b><span>${esc(p?.bio || '')}</span></div>`}${typing ? '<div class="typing" aria-label="En train d\'écrire"><i></i><i></i><i></i></div>' : ''}</div></main>
      <div class="composer"><textarea id="dm-text" data-keep rows="1" maxlength="1000" placeholder="Message"></textarea><button class="send" data-act="send-dm" aria-label="Envoyer">${icon('send', 18)}</button></div>`;
  },

  settings() {
    const s = state.settings;
    const sw = (key, label, on) => `<label class="cell"><span class="grow">${label}</span><input class="switch" type="checkbox" data-setting="${key}"${on ? ' checked' : ''}></label>`;
    const words = s.mutedWords.map((w, i) => `<div class="cell"><span class="grow">${esc(w)}</span><button class="link" data-act="unmute-word" data-i="${i}">Retirer</button></div>`).join('');
    const users = s.mutedUsers.map((h) => `<div class="cell">${avatar(h, 30)}<span class="grow">@${h}</span><button class="link" data-act="unmute-user" data-user="${h}">Afficher</button></div>`).join('');
    const used = new TextEncoder().encode(JSON.stringify(state)).length;
    const chevron = icon('back', 16).replace('<svg', '<svg style="transform:rotate(180deg);color:var(--muted)"');
    const account = online()
      ? `<div class="group-title">Compte du fédivers</div>
        <div class="group"><button class="cell" data-act="edit-profile">${avatar(me(), 30)}<span class="grow">${esc(nameOf(me()))} · @${esc(me())}@${esc(fedi.account.domain)}</span>${chevron}</button><button class="cell danger" data-act="disconnect">Se déconnecter de ${esc(fedi.account.domain)}</button></div>
        <div class="group-foot">Agora passe par Orion pour joindre ${esc(fedi.account.domain)} (autorisation « Internet »). Votre mot de passe reste chez votre instance.</div>`
      : `<div class="group-title">Profil</div>
        <div class="group"><button class="cell" data-act="edit-profile">${avatar(me(), 30)}<span class="grow">${esc(state.profile.name)} · @${me()}</span>${chevron}</button></div>
        <div class="group-title">Fédivers</div>
        <div class="group"><button class="cell accent" data-act="go-connect">${icon('userPlus', 18)} Se connecter à Mastodon (ou compatible)</button></div>
        <div class="group-foot">Retrouvez les vraies personnes du fédivers : Mastodon, Piaille, Framapiaf… La démonstration reste disponible.</div>`;
    return `${header('Réglages')}
      <main class="scroll">
        ${account}
        <div class="group-title">Notifications</div>
        <div class="group">${sw('notify.like', 'J\'aime', s.notify.like)}${sw('notify.reply', 'Réponses et mentions', s.notify.reply)}${sw('notify.follow', 'Nouveaux abonnés', s.notify.follow)}${sw('notify.repost', 'Partages', s.notify.repost)}${sw('notify.dm', 'Messages', s.notify.dm)}${sw('background', 'Quand Agora est en arrière-plan', s.background)}</div>
        <div class="group-foot">En arrière-plan, Agora vous prévient par une notification d'Orion.</div>
        <div class="group-title">Mots masqués</div>

function exploreContent() {
  const results = search(ui.query);
  if (results) {
    const { people, tags, posts } = results;
    if (results.loading) return '<div class="empty"><span class="spinner"></span></div>';
    if (results.error) return empty('Recherche impossible', esc(results.error));
    if (!people.length && !tags.length && !posts.length) return empty('Aucun résultat', `Rien ne correspond à « ${esc(ui.query.trim())} ».`);
    return `${people.length ? `<div class="section">Personnes</div>${people.map((h) => personRow(h)).join('')}` : ''}
      ${tags.length ? `<div class="section">Mots-dièse</div>${tags.map((t) => `<button class="trend" data-act="tag" data-tag="${esc(t)}"><b>#${esc(t)}</b></button>`).join('')}` : ''}
      ${posts.length ? `<div class="section">Publications</div>${posts.slice(0, 30).map((p) => postCard(p)).join('')}` : ''}`;
  }
  const trending = trends();
  const popular = online() ? [] : state.posts.filter((p) => !p.repostOf && !p.replyTo && !hidden(p) && Date.now() - p.at < 3 * DAY).sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 5);
  const others = suggestions();
  const where = online() ? fedi.account.domain : 'Agora';
  if (online() && !fedi.trends?.length && !others) return fedi.trends ? empty('', 'Cherchez des personnes (@nom@instance), des mots-dièse ou des publications.') : '<div class="empty"><span class="spinner"></span></div>';
  return `${trending.length ? `<div class="section">Tendances</div>${trending.map(([tag, n], i) => `<button class="trend" data-act="tag" data-tag="${esc(tag)}"><small>${i + 1} · Tendance sur ${esc(where)}</small><b>#${esc(tag)}</b><small>${online() ? plural(n, 'personne en parle', 'personnes en parlent') : plural(n, 'publication', 'publications')}</small></button>`).join('')}` : ''}
    ${others ? `<div class="section">Personnes à suivre</div>${others}` : ''}
    ${popular.length ? `<div class="section">Populaires</div>${popular.map((p) => postCard(p)).join('')}` : ''}`;
}

// ───────────── Affichage ─────────────

let observer = null;
function render() {
  $app.dataset.view = ui.view;
  $app.innerHTML = VIEWS[ui.view]();
  observer?.disconnect();
  const more = $app.querySelector('.more-btn');
  if (more && 'IntersectionObserver' in window) {
    observer = new IntersectionObserver((entries) => entries.some((e) => e.isIntersecting) && showMore(), { root: $app.querySelector('.scroll'), rootMargin: '300px' });
    observer.observe(more);
  }
  loadImages($app);
  if (ui.view === 'compose') composeReady();
  if (ui.view === 'chat') {
    const scroller = $app.querySelector('.scroll');
    scroller.scrollTop = scroller.scrollHeight;
    if (online()) {
      const conv = chatConv();
      if (conv?.unread && conv.id) {
        conv.unread = false;
        remote(`/api/v1/conversations/${conv.id}/read`, {});
      }
    } else {
      state.dmRead[ui.params.user] = Date.now();
      save('dmRead');
    }
  }
  const remoteNotifs = online() && ui.view === 'notifs' ? fedi.lists.get('notifs')?.items || [] : [];
  if (remoteNotifs.some((n) => !n.read)) {
    remoteNotifs.forEach((n) => (n.read = true));
    markNotifsRead();
    updateTabs();
  }
  if (!online() && ui.view === 'notifs' && state.notifs.some((n) => !n.read)) {
    state.notifs.forEach((n) => (n.read = true));
    save('notifs');
    updateTabs();
  }
}

/** Redessine l'écran sans perdre le défilement ni la saisie en cours. */
function rerender({ highlight = [] } = {}) {
  const top = $app.querySelector('.scroll')?.scrollTop || 0;
  const kept = [...$app.querySelectorAll('[data-keep]')].map((el) => ({ id: el.id, value: el.value, focus: el === document.activeElement, a: el.selectionStart, b: el.selectionEnd }));
  render();
  const scroller = $app.querySelector('.scroll');
  if (scroller && ui.view !== 'chat') scroller.scrollTop = top;
  for (const k of kept) {
    const el = document.getElementById(k.id);
    if (!el) continue;
    el.value = k.value;
    autosize(el);
    if (k.focus) {
      el.focus();
      try {
        el.setSelectionRange(k.a, k.b);
      } catch {
        /* champ sans sélection */
      }
    }
  }
  for (const id of highlight) $app.querySelector(`[data-card="${id}"]`)?.classList.add('unseen');
}

function updateTabs() {
  const nav = $app.querySelector('.tabs');
  if (nav) nav.outerHTML = tabs();
}

/** Remet à jour les publications affichées d'un id (après un j'aime, un partage…). */
function refreshCards(id) {
  for (const card of $app.querySelectorAll(`[data-card="${id}"]`)) {
    const entry = find(card.dataset.entry);
    if (!entry) continue;
    const html = card.dataset.detail ? detailCard(entry) : postCard(entry, { line: Boolean(card.dataset.line), pinned: Boolean(card.dataset.pinned) });
    card.insertAdjacentHTML('afterend', html);
    card.remove();
  }
  loadImages($app);
}

function autosize(el) {
  if (el?.tagName !== 'TEXTAREA') return;
  const max = el.id === 'c-text' ? 600 : 120;
  el.style.height = 'auto';
  el.style.height = `${Math.min(el.scrollHeight + 2, max)}px`;
}

// ───────────── Navigation ─────────────

const ROOTS = { home: 'home', explore: 'explore', notifs: 'notifs', me: 'profile' };
const scrollTop = () => $app.querySelector('.scroll')?.scrollTop || 0;

function switchTab(tab) {
  if (ui.tab === tab && !stack.length && ui.view === ROOTS[tab]) {
    $app.querySelector('.scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
    if (tab === 'home' && ui.fresh) showFresh();
    return;
  }
  Object.assign(ui, { tab, view: ROOTS[tab], params: tab === 'me' ? { user: me() } : {}, shown: PAGE, profileTab: 'posts' });
  stack.length = 0;
  render();
}
function go(view, params = {}) {
  stack.push({ view: ui.view, params: ui.params, scroll: scrollTop(), shown: ui.shown, profileTab: ui.profileTab });
  Object.assign(ui, { view, params, shown: PAGE });
  if (view === 'profile') ui.profileTab = 'posts';
  render();
}
function back() {
  const previous = stack.pop();
  if (!previous) {
    if (ui.tab === 'home' && ui.view === 'home') return false;
    switchTab(ui.view === ROOTS[ui.tab] ? 'home' : ui.tab);
    return true;
  }
  Object.assign(ui, { view: previous.view, params: previous.params, shown: previous.shown, profileTab: previous.profileTab });
  render();
  const scroller = $app.querySelector('.scroll');
  if (scroller && ui.view !== 'chat') scroller.scrollTop = previous.scroll;
  return true;
}
function showMore() {
  if (online()) {
    // Défilement : page suivante (pas de nouvel essai automatique après une erreur).
    const entry = fedi.lists.get(currentKey());
    if (!entry || entry.loading || !entry.next || entry.error) return;
    load(currentKey(), { more: true });
    const button = $app.querySelector('.more-btn');
    if (button) button.textContent = 'Chargement…';
    return;
  }
  ui.shown += PAGE;
  rerender();
}
function showFresh() {
  ui.fresh = 0;
  render();
}
const openPost = (id) => find(id) && go('post', { id });
const openProfile = (handle) => person(handle) && (isMe(handle) && ui.tab === 'me' && !stack.length ? switchTab('me') : go('profile', { user: handle }));
function openChat(handle, conv = null) {
  if (!handle || (!online() && !PERSON.has(handle))) return;
  if (ui.view === 'chat') stack.pop(); // depuis la liste de choix : pas d'écran en double
  go('chat', conv ? { user: handle, conv } : { user: handle });
}
const chatConv = () => (fedi.convs || []).find((c) => c.id && c.id === ui.params.conv) || convWith(ui.params.user);

// ───────────── Feuille d'actions et message temporaire ─────────────

let sheetDone = null;
let sheetActions = [];
function sheet({ title = '', actions }) {
  closeSheet(null);
  sheetActions = actions.filter(Boolean);
  $sheet.innerHTML = `
    <div class="sheet-backdrop" data-sheet="-1"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-group">${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}${sheetActions.map((a, i) => `<button class="sheet-btn${a.danger ? ' danger' : ''}${a.html ? ' person' : ''}" data-sheet="${i}">${a.html || esc(a.label)}</button>`).join('')}</div>
      <button class="sheet-btn cancel" data-sheet="-1">Annuler</button>
    </div>`;
  $sheet.hidden = false;
  loadImages($sheet);
  requestAnimationFrame(() => $sheet.classList.add('open'));
  return new Promise((resolve) => (sheetDone = resolve));
}
function closeSheet(value) {
  if (!sheetDone) return;
  const done = sheetDone;
  sheetDone = null;
  $sheet.classList.remove('open');
  $sheet.hidden = true;
  done(value);
}
$sheet.addEventListener('click', (event) => {
  const button = event.target.closest('[data-sheet]');
  if (!button) return;
  const i = Number(button.dataset.sheet);
  closeSheet(i >= 0 ? sheetActions[i].value : null);
});

let snackTimer = 0;
let snackAction = null;
function snack(text, action = null) {
  clearTimeout(snackTimer);
  snackAction = action;
  $snack.innerHTML = `<span>${esc(text)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  $snack.classList.add('show');
  snackTimer = setTimeout(() => {
    $snack.classList.remove('show');
    snackAction = null;
  }, action ? 5000 : 2500);
}
$snack.addEventListener('click', (event) => {
  if (!event.target.closest('button') || !snackAction) return;
  const action = snackAction;
  snackAction = null;
  clearTimeout(snackTimer);
  $snack.classList.remove('show');
  action.run();
});

// ───────────── Publications ─────────────

function toggleLike(id, { pop = true } = {}) {
  const p = find(id);
  if (!p) return;
  p.liked = !p.liked;
  p.likes = Math.max(0, (p.likes || 0) + (p.liked ? 1 : -1));
  if (p.liked) orion.device.vibrate(8).catch(() => {});
  if (online()) {
    remote(`/api/v1/statuses/${id}/${p.liked ? 'favourite' : 'unfavourite'}`, {}, () => {
      p.liked = !p.liked;
      p.likes = Math.max(0, p.likes + (p.liked ? 1 : -1));
      refreshCards(id);
    });
    fedi.lists.delete('likes');
  } else save('posts');
  refreshCards(id);
  if (pop && p.liked) $app.querySelectorAll(`[data-card="${id}"] .act.like`).forEach((b) => b.classList.add('pop'));
}
function burst(x, y) {
  const el = document.createElement('span');
  el.className = 'burst';
  el.style.cssText = `position:fixed;left:${x}px;top:${y}px`;
  el.innerHTML = icon('heartFill', 84);
  document.body.append(el);
  setTimeout(() => el.remove(), 720);
}

async function repostMenu(id) {
  const p = find(id);
  if (!p) return;
  const choice = await sheet({ actions: [{ label: p.reposted ? 'Annuler le partage' : 'Partager', value: 'repost' }, { label: 'Citer', value: 'quote' }] });
  if (choice === 'quote') return compose({ quoteOf: id });
  if (choice !== 'repost') return;
  if (online()) {
    const undo = () => {
      p.reposted = !p.reposted;
      p.reposts = Math.max(0, p.reposts + (p.reposted ? 1 : -1));
      refreshCards(id);
    };
    undo();
    const shared = await remote(`/api/v1/statuses/${id}/${p.reposted ? 'reblog' : 'unreblog'}`, {}, undo);
    const home = fedi.lists.get('home');
    if (shared && p.reposted && home && shared.id !== id) home.ids.unshift(shared.id);
    if (shared && p.reposted) snack('Publication partagée avec vos abonnés');
    return ui.view === 'home' ? rerender() : refreshCards(id);
  }
  if (p.reposted) {
    p.reposted = false;
    p.reposts = Math.max(0, (p.reposts || 1) - 1);
    state.posts = state.posts.filter((x) => !(isMe(x.author) && x.repostOf === id));
  } else {
    p.reposted = true;
    p.reposts = (p.reposts || 0) + 1;
    state.posts.push({ id: newId(), author: me(), repostOf: id, text: '', at: Date.now() });
    if (PERSON.has(p.author) && chance(0.7)) plan(between(5, 20) * 1000, { type: 'follow', actor: p.author });
    snack('Publication partagée avec vos abonnés');
  }
  changed();
  save('posts');
  if (ui.view === 'home') rerender();
  else refreshCards(id);
}

function toggleBookmark(id) {
  const saved = marked(id);
  if (online()) {
    const p = find(id);
    p.bookmarked = !saved;
    remote(`/api/v1/statuses/${id}/${saved ? 'unbookmark' : 'bookmark'}`, {}, () => {
      p.bookmarked = saved;
      refreshCards(id);
    });
    fedi.lists.delete('saved');
    refreshCards(id);
    return snack(saved ? 'Retirée des enregistrements' : 'Enregistrée : retrouvez-la dans votre profil');
  }
  state.bookmarks = saved ? state.bookmarks.filter((x) => x !== id) : [...state.bookmarks, id].slice(-200);
  save('bookmarks');
  refreshCards(id);
  snack(saved ? 'Retirée des enregistrements' : 'Enregistrée : retrouvez-la dans votre profil');
}

function vote(id, option) {
  const p = find(id);
  if (!p?.poll || p.poll.mine != null || Date.now() > p.poll.ends) return;
  p.poll.mine = option;
  p.poll.options[option].votes++;
  refreshCards(id);
  if (!online()) return save('posts');
  api(`/api/v1/polls/${p.poll.id}/votes`, { method: 'POST', body: { choices: [option] } })
    .then(({ data }) => Object.assign(p.poll, { options: data.options.map((o) => ({ text: o.title, votes: o.votes_count || 0 })), mine: data.own_votes?.[0] ?? option }))
    .catch((error) => {
      p.poll.mine = null;
      p.poll.options[option].votes--;
      snack(error.message);
    })
    .finally(() => refreshCards(id));
}

async function moreMenu(id) {
  const p = find(id);
  if (!p) return;

  if (isMe(author)) {
    const pinned = online() ? p.pinned : state.profile.pinned === id;

    });
    if (choice === 'pin' && online()) {

      { label: `Masquer @${author}`, value: 'mute' },

    ],
  });
  if (choice === 'follow') toggleFollow(author);
  else if (choice === 'dm') openChat(author);
  else if (choice === 'mute') muteUser(author);
  else if (choice === 'report') {

    if (online()) remote('/api/v1/reports', { body: { account_id: person(author)?.id, status_ids: [id], comment: 'Signalé depuis Agora (Orion OS)' } });
    state.settings.hiddenPosts.push(id);
    state.settings.hiddenPosts = state.settings.hiddenPosts.slice(-200);

    changed();
    afterHide();
    snack('Merci. Cette publication ne s\'affichera plus.', { label: 'Annuler', run: () => { state.settings.hiddenPosts = state.settings.hiddenPosts.filter((x) => x !== id); save('settings'); changed(); rerender(); } });
  }
}
function afterHide() {
  if (ui.view === 'post' && !find(ui.params.id)) return back();
  rerender();
}
function removePost(id) {
  if (online()) {
    return api(`/api/v1/statuses/${id}`, { method: 'DELETE' })
      .then(() => {
        fedi.posts.delete(id);
        for (const entry of fedi.lists.values()) entry.ids = entry.ids.filter((x) => x !== id && find(x)?.repostOf !== id);
        snack('Publication supprimée');
        if (ui.view === 'post' && ui.params.id === id) back();
        else rerender();
      })
      .catch((error) => snack(error.message));
  }
  const gone = new Set([id]);
  // Ses réponses (et leurs réponses) disparaissent avec elle, ainsi que ses partages.
  for (let grew = true; grew; ) {
    grew = false;
    for (const p of state.posts) {
      if (gone.has(p.id) || !(gone.has(p.replyTo) || gone.has(p.repostOf))) continue;
      gone.add(p.id);
      grew = true;
    }
  }
  state.posts = state.posts.filter((p) => !gone.has(p.id));
  state.notifs = state.notifs.filter((n) => !gone.has(n.post));
  state.bookmarks = state.bookmarks.filter((b) => !gone.has(b));
  if (gone.has(state.profile.pinned)) state.profile.pinned = null;
  state.sim.queue = state.sim.queue.filter((e) => !gone.has(e.post));
  changed();
  save('posts', 'notifs', 'bookmarks', 'profile', 'sim');
  snack('Publication supprimée');
  if (ui.view === 'post' && gone.has(ui.params.id)) back();
  else rerender();
}

function toggleFollow(handle) {
  if (online()) {
    const p = person(handle);
    if (!p?.id) return;
    const before = { ...relation(handle) };
    const was = Boolean(before.following || before.requested);
    fedi.relations.set(handle, { ...before, following: !was && !p.locked, requested: !was && p.locked });
    rerender();
    api(`/api/v1/accounts/${p.id}/${was ? 'unfollow' : 'follow'}`, { method: 'POST' })
      .then(({ data }) => {
        fedi.relations.set(handle, data);
        fedi.lists.delete('home');
        if (was) snack(`Vous ne suivez plus ${nameOf(handle)}`);
      })
      .catch((error) => {
        fedi.relations.set(handle, before);
        snack(error.message);
      })
      .finally(() => rerender());
    return;
  }
  if (!PERSON.has(handle)) return;
  if (state.follows.includes(handle)) {
    state.follows = state.follows.filter((h) => h !== handle);
    snack(`Vous ne suivez plus ${nameOf(handle)}`);
  } else {
    state.follows.push(handle);
    if (!followsMe(handle) && chance(0.85)) plan(between(8, 40) * 1000, { type: 'follow', actor: handle });
  }
  save('follows');
  rerender();
}
function muteUser(handle) {

  if (!state.settings.mutedUsers.includes(handle)) state.settings.mutedUsers.push(handle);

function unmuteUser(handle) {

// ───────────── Rédaction ─────────────

function compose({ replyTo = null, quoteOf = null, edit = null } = {}) {
  const editing = edit && find(edit);
  const plain = !replyTo && !quoteOf && !edit;
  // Un brouillon de publication est repris ; les réponses et citations partent de zéro.
  if (!(plain && state.draft && !state.draft.replyTo && !state.draft.quoteOf && !state.draft.edit)) {
    // Fédivers : une réponse mentionne son destinataire (sinon il n'est pas prévenu).
    const to = online() && replyTo && find(replyTo)?.author;
    state.draft = { text: editing ? editing.text : to && !isMe(to) ? `@${to} ` : '', replyTo, quoteOf, edit: editing ? edit : null, bg: editing?.bg ?? null, poll: null, palette: false };
  }
  go('compose');
}
function composeReady() {
  const text = document.getElementById('c-text');
  autosize(text);
  updateCompose();
  setTimeout(() => {
    text.focus();
    text.setSelectionRange(text.value.length, text.value.length);
  }, 60);
}
function updateCompose() {
  const d = state.draft;
  const left = maxText() - d.text.length;
  const counter = document.getElementById('counter');
  counter.textContent = left < 60 ? String(left) : '';
  counter.classList.toggle('over', left < 0);
  const options = d.poll ? d.poll.options.map((o) => o.trim()).filter(Boolean) : [];
  document.getElementById('publish').disabled = !d.text.trim() || left < 0 || (d.poll && options.length < 2);
  const preview = document.getElementById('bg-preview');
  if (preview) preview.textContent = d.text || 'Votre texte ici';
  // Mention en cours : propositions de membres.
  const input = document.getElementById('c-text');
  const typed = /(^|\s)@([a-z0-9_.@-]*)$/i.exec(d.text.slice(0, input.selectionStart ?? d.text.length));
  const box = document.getElementById('suggest');
  const pool = online() ? [...fedi.people.values()].filter((p) => !p.partial && !isMe(p.handle)) : PEOPLE;
  const matches = typed ? pool.filter((p) => fold(`${p.handle} ${p.name}`).includes(fold(typed[2]))).slice(0, 6) : [];
  box.innerHTML = matches.map((p) => `<button class="chip" data-act="mention-pick" data-user="${esc(p.handle)}">${avatar(p.handle, 26)}@${esc(p.handle)}</button>`).join('');
  loadImages(box);
}
function insertText(snippet, replaceToken = false) {
  const input = document.getElementById('c-text');
  const at = input.selectionStart ?? input.value.length;
  let before = input.value.slice(0, at);
  if (replaceToken) before = before.replace(/@[a-z0-9_.@-]*$/i, '');
  else if (before && !/\s$/.test(before)) before += ' ';
  input.value = before + snippet + input.value.slice(at);
  const caret = (before + snippet).length;
  input.focus();
  input.setSelectionRange(caret, caret);
  state.draft.text = input.value;
  autosize(input);
  updateCompose();
}
async function leaveCompose() {
  const d = state.draft;
  const plain = !d.edit && !d.replyTo && !d.quoteOf;
  if (d.edit || !d.text.trim()) {
    state.draft = null;
    save('draft');
    return back();
  }
  // Seul un brouillon de publication se garde : une réponse ou une citation repart de zéro.
  const choice = await sheet({ actions: [plain && { label: 'Garder le brouillon', value: 'keep' }, { label: plain ? 'Supprimer le brouillon' : 'Abandonner', value: 'drop', danger: true }] });
  if (!choice) return;
  if (choice === 'drop') state.draft = null;
  save('draft');
  back();
}
function publish() {
  const d = state.draft;
  const text = d.text.trim();
  if (!text || text.length > maxText()) return;
  if (online()) return publishRemote(d, text);
  if (d.edit) {
    const p = find(d.edit);
    if (p) Object.assign(p, { text, edited: true });
    state.draft = null;
    save('posts', 'draft');
    back();
    return snack('Publication modifiée');
  }
  const post = { id: newId(), author: me(), text, at: Date.now(), likes: 0, liked: false, reposts: 0, reposted: false };
  if (d.replyTo) post.replyTo = d.replyTo;
  if (d.quoteOf) post.quoteOf = d.quoteOf;
  if (d.bg != null && !d.poll) post.bg = d.bg;
  if (d.poll) {
    const options = d.poll.options.map((o) => o.trim()).filter(Boolean);
    if (options.length < 2) return;
    post.poll = { options: options.map((o) => ({ text: o, votes: 0 })), ends: Date.now() + POLL_DURATIONS[d.poll.duration].ms, mine: null };
  }
  state.posts.push(post);
  changed();
  state.draft = null;
  save('posts', 'draft');
  reactTo(post);
  orion.device.vibrate(12).catch(() => {});
  back();
  if (ui.view === 'home') {
    ui.feed = 'following';
    render();
  }
  snack(post.replyTo ? 'Réponse publiée' : 'Publication partagée', { label: 'Voir', run: () => openPost(post.id) });
}
/** Visibilité d'une réponse : jamais plus large que la publication d'origine. */
const replyVisibility = (parent) => (['direct', 'private', 'unlisted'].includes(parent?.visibility) ? parent.visibility : 'public');
const withMention = (text, handle) => (!handle || isMe(handle) || new RegExp(`(^|\\s)@${handle.replace(/[.]/g, '\\.')}(\\s|$)`, 'i').test(text) ? text : `@${handle} ${text}`);

let publishing = false;
async function publishRemote(d, text) {
  if (publishing) return;
  const options = d.poll ? d.poll.options.map((o) => o.trim()).filter(Boolean) : [];
  if (d.poll && options.length < 2) return;
  const parent = find(d.replyTo);
  const quoted = find(d.quoteOf);
  const editing = d.edit && find(d.edit);
  // Pas de citation sur Mastodon : l'adresse de la publication citée est ajoutée au texte.
  const status = quoted?.url ? `${text}\n\n${quoted.url}` : withMention(text, parent?.author);
  const body = editing ? { status, spoiler_text: editing.cw || '', sensitive: editing.sensitive } : { status, visibility: replyVisibility(parent), language: 'fr' };
  if (parent) body.in_reply_to_id = parent.id;
  if (d.poll && !editing) body.poll = { options, expires_in: POLL_DURATIONS[d.poll.duration].ms / 1000 };
  publishing = true;
  const button = document.getElementById('publish');
  if (button) button.disabled = true;
  let post;
  try {
    post = postFrom((await api(editing ? `/api/v1/statuses/${editing.id}` : '/api/v1/statuses', { method: editing ? 'PUT' : 'POST', body })).data);
  } catch (error) {
    snack(error.message);
    if (ui.view === 'compose') updateCompose();
    return;
  } finally {
    publishing = false;
  }
  state.draft = null;
  save('draft');
  orion.device.vibrate(12).catch(() => {});
  if (editing) {
    back();
    return snack('Publication modifiée');
  }
  if (parent) {
    parent.replies = (parent.replies || 0) + 1;
    fedi.contexts.get(parent.id)?.descendants.push(post.id);
  } else {
    fedi.lists.get('home')?.ids.unshift(post.id);
    fedi.lists.get(`posts:${fedi.account.me.id}`)?.ids.unshift(post.id);
  }
  back();
  if (ui.view === 'home' && !parent) {
    ui.feed = 'following';
    render();
  }
  snack(parent ? 'Réponse publiée' : 'Publication partagée', { label: 'Voir', run: () => openPost(post.id) });
}

function sendReply() {
  const input = document.getElementById('reply-text');
  const text = input.value.trim();
  if (!text) return;
  if (text.length > maxText()) return snack(`${maxText()} caractères au plus`);
  if (online()) {
    const parent = find(ui.params.id);
    if (!parent || publishing) return;
    publishing = true;
    input.disabled = true;
    api('/api/v1/statuses', { method: 'POST', body: { status: withMention(text, parent.author), in_reply_to_id: parent.id, visibility: replyVisibility(parent), language: 'fr' } })
      .then(({ data }) => {
        const post = postFrom(data);
        parent.replies = (parent.replies || 0) + 1;
        fedi.contexts.get(parent.id)?.descendants.push(post.id);
        const field = document.getElementById('reply-text');
        if (field) field.value = '';
        rerender();
        const scroller = $app.querySelector('.scroll');
        if (ui.view === 'post' && scroller) scroller.scrollTop = scroller.scrollHeight;
      })
      .catch((error) => snack(error.message))
      .finally(() => {
        publishing = false;
        const field = document.getElementById('reply-text');
        if (field) field.disabled = false;
      });
    return;
  }
  const post = { id: newId(), author: me(), text, at: Date.now(), likes: 0, liked: false, reposts: 0, reposted: false, replyTo: ui.params.id };
  state.posts.push(post);
  changed();
  save('posts');
  reactTo(post);
  input.value = '';
  rerender();
  const scroller = $app.querySelector('.scroll');
  scroller.scrollTop = scroller.scrollHeight;
}

function sendDm() {

/** Message privé du fédivers : publication « mentionnées seulement », dans le fil de la conversation. */
function sendRemoteDm(input, text) {
  const handle = ui.params.user;
  const conv = chatConv();
  const before = chatPosts(conv);
  const to = conv ? conv.accounts : [handle];
  input.value = '';
  autosize(input);
  api('/api/v1/statuses', { method: 'POST', body: { status: `${to.map((h) => `@${h}`).join(' ')} ${text}`, visibility: 'direct', ...(before.length ? { in_reply_to_id: before.at(-1).id } : {}) } })
    .then(({ data }) => {
      const post = postFrom(data);
      fedi.contexts.set(post.id, { ancestors: before.map((p) => p.id), descendants: [] });
      if (conv) {
        conv.last = post.id;
        fedi.convs = [conv, ...fedi.convs.filter((c) => c !== conv)];
      } else fedi.convs = [{ id: null, accounts: [handle], last: post.id, unread: false }, ...(fedi.convs || [])];
      if (ui.view === 'chat') rerender();
    })
    .catch((error) => {
      snack(error.message);
      const field = document.getElementById('dm-text');
      if (field && !field.value) field.value = text;
    });
}

// ───────────── Activité : affichage et notifications ─────────────

const DESCRIBE = {
  like: (f) => `${nameOf(f.actor)} a aimé votre publication`,
  repost: (f) => `${nameOf(f.actor)} a partagé votre publication`,
  reply: (f) => `${nameOf(f.actor)} a répondu : « ${f.text} »`,
  mention: (f) => `${nameOf(f.actor)} a parlé de vous : « ${f.text} »`,
  follow: (f) => `${nameOf(f.actor)} vous suit désormais`,
  vote: (f) => `${nameOf(f.actor)} a voté à votre sondage`,
  poll: () => 'Votre sondage est terminé',
  dm: (f) => `${nameOf(f.actor)} : ${f.text}`,
};
const wanted = (f) => f.kind !== 'post' && state.settings.notify[{ mention: 'reply', vote: 'poll', poll: 'poll' }[f.kind] || f.kind] !== false;

let pending = [];
let lastNotify = 0;
let notifyTimer = 0;
/** En arrière-plan : une notification d'Orion (au plus une toutes les 5 secondes, regroupées). */
function notifyLater(items) {
  pending.push(...items);
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => {
    const list = pending.splice(0);
    if (!list.length) return;
    lastNotify = Date.now();
    const body = list.length === 1 ? DESCRIBE[list[0].kind](list[0]) : `${DESCRIBE[list[0].kind](list[0])}, et ${list.length - 1} autre${list.length > 2 ? 's' : ''} activité${list.length > 2 ? 's' : ''}`;
    orion.notify({ title: 'Agora', body }).catch(() => {});
  }, Math.max(300, lastNotify + 5200 - Date.now()));
}

function announce(fresh) {
  const alerts = fresh.filter(wanted);
  if (paused) {
    if (state.settings.background && alerts.length) notifyLater(alerts);
    return;
  }
  const dm = alerts.find((f) => f.kind === 'dm');
  const reply = alerts.find((f) => f.kind === 'reply' || f.kind === 'mention');
  if (dm && !(ui.view === 'chat' && ui.params.user === dm.actor)) {
    snack(DESCRIBE.dm(dm), { label: 'Lire', run: () => openChat(dm.actor) });
    orion.device.vibrate([10, 50, 10]).catch(() => {});
  } else if (reply && !['notifs', 'compose'].includes(ui.view) && !(ui.view === 'post' && find(reply.post)?.replyTo === ui.params.id)) {
    snack(DESCRIBE[reply.kind](reply), { label: 'Voir', run: () => openPost(reply.post) });
  }
  if (ui.view === 'home') {
    const ids = new Set(feed(ui.feed).map((p) => p.id));
    const added = fresh.filter((f) => f.kind === 'post' && ids.has(f.post)).map((f) => f.post);
    if (added.length && scrollTop() > 80) {
      ui.fresh += added.length;
      updateFreshPill();
    } else rerender({ highlight: added });
  } else if (['notifs', 'post', 'chat', 'messages', 'profile', 'tag'].includes(ui.view)) rerender();
  else updateTabs();
}

// ───────────── Première ouverture ─────────────

const slug = (name) => fold(name).replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '').slice(0, 20) || '';
function handleProblem(handle, current = null) {
  if (!HANDLE.test(handle)) return 'L\'identifiant fait 3 à 20 caractères : lettres minuscules, chiffres, point ou tiret bas.';
  if (handle !== current && PERSON.has(handle)) return 'Cet identifiant est déjà pris.';
  return '';
}

function seed() {
  const now = Date.now();
  state.posts = [];
  const add = (author, text, at, extra = {}) => {
    const post = { id: newId(), author, text, at: Math.round(at), likes: between(3, 70), reposts: between(0, 9), ...extra };
    state.posts.push(post);
    return post;
  };
  for (const p of PEOPLE.slice(1)) {
    for (let i = 0; i < 3; i++) add(p.handle, p.posts[i], now - between(20, 46 * 60) * MINUTE);
    state.sim.cursor[p.handle] = 3;
  }
  // Quelques conversations entre membres.
  for (const target of shuffle(state.posts).slice(0, 9)) {
    const actor = pick(PEOPLE.slice(1).filter((p) => p.handle !== target.author));
    add(actor.handle, replyText(actor.handle, target.text), Math.min(now - MINUTE, target.at + between(3, 180) * MINUTE), { replyTo: target.id, likes: between(0, 12), reposts: 0 });
  }
  for (const poll of POLLS) add(poll.who, poll.text, now - between(30, 600) * MINUTE, { poll: { options: poll.options.map((text) => ({ text, votes: between(4, 45) })), ends: now + between(5, 47) * HOUR, mine: null } });
  add('agora', PERSON.get('agora').posts[0], now - 2 * MINUTE, { likes: 214, reposts: 31 });
  state.sim.cursor.agora = 1;
  changed();
  Object.assign(state.sim, { queue: [], ambientAt: now + 40_000, lastRun: now });
}

function startAgora() {
  const follows = ['agora', ...INTERESTS.filter((i) => ui.interests.has(i.id)).flatMap((i) => i.who)];
  if (follows.length === 1) follows.push(...shuffle(PEOPLE.slice(1)).slice(0, 3).map((p) => p.handle));
  Object.assign(state, { follows, followers: [], notifs: [], dms: {}, dmRead: {}, bookmarks: [], draft: null });
  seed();
  save('profile', 'posts', 'follows', 'followers', 'notifs', 'dms', 'dmRead', 'bookmarks', 'settings', 'sim', 'draft');
  flush();
  // Les premiers abonnés : l'équipe d'Agora et quelques membres suivis.
  plan(6000, { type: 'follow', actor: 'agora' });
  shuffle(follows.filter((h) => h !== 'agora')).slice(0, 2).forEach((h, i) => plan(between(15, 35) * 1000 * (i + 1), { type: 'follow', actor: h }));
  plan(20_000, { type: 'dm', actor: 'agora', text: `Bienvenue ${firstName()} ! 👋 Votre première publication vous attend : touchez + en bas de l'écran. Les membres marqués « démo » vous répondront.` });
  Object.assign(ui, { tab: 'home', view: 'home', feed: 'following', shown: PAGE, fresh: 0 });
  stack.length = 0;
  render();
  arm();
}

async function eraseAll() {
  const where = online() ? ` Agora sera aussi déconnecté de ${fedi.account.domain} (votre compte y reste intact).` : '';
  if (!(await orion.ui.confirm({ title: 'Effacer Agora ?', message: `Votre profil, vos publications, vos messages et vos réglages seront supprimés de cet appareil.${where}`, confirmLabel: 'Effacer' }))) return;
  if (online()) await disconnect();
  clearTimeout(simTimer);
  dirty.clear();
  await saving;
  await orion.storage.clear();
  Object.assign(state, { profile: null, posts: [], follows: [], followers: [], notifs: [], dms: {}, dmRead: {}, bookmarks: [], settings: structuredClone(DEFAULT_SETTINGS), sim: { queue: [], ambientAt: 0, lastRun: 0, cursor: {} }, draft: null });
  changed();
  stack.length = 0;
  Object.assign(ui, { tab: 'home', view: 'welcome', params: {}, interests: new Set() });
  render();
}

// ───────────── Connexion au fédivers ─────────────

async function startConnect() {
  if (ui.connecting) return;
  ui.domain = document.getElementById('c-domain')?.value || ui.domain || '';
  ui.connectError = '';
  const status = (text) => {
    ui.connecting = text;
    if (ui.view === 'connect') rerender();
  };
  status('Connexion…');
  try {
    await connect(ui.domain, status);
  } catch (error) {
    ui.connecting = '';
    ui.connectError = error.message;
    if (ui.view === 'connect') rerender();
    return;
  }
  ui.connecting = '';
  clearTimeout(simTimer);
  stack.length = 0;
  Object.assign(ui, { tab: 'home', view: 'home', feed: 'following', params: {}, shown: PAGE, fresh: 0, query: '' });
  render();
  goOnline();
  snack(`Connecté à ${fedi.account.domain}`);
}
/** Une fois connecté : notifications, messages, puis relève régulière. */
function goOnline() {
  listOf('notifs');
  loadConvs();
  schedulePoll();
}
async function askDisconnect() {
  const domain = fedi.account.domain;
  if (await orion.ui.confirm({ title: `Se déconnecter de ${domain} ?`, message: 'Agora oublie l\'accès à votre compte (votre compte reste intact sur l\'instance) et revient à la démonstration.', confirmLabel: 'Se déconnecter' })) {
    await disconnect();
    snack(`Déconnecté de ${domain}`);
  }
}

// ───────────── Événements ─────────────

let tapTimer = 0;
let lastTap = { id: null, at: 0 };
/** Un toucher ouvre la publication ; deux touchers rapides l'aiment. */
function tapPost(el, event) {
  if (getSelection()?.toString()) return;
  const id = el.dataset.id;
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.at < 320) {
    clearTimeout(tapTimer);
    lastTap = { id: null, at: 0 };
    burst(event.clientX, event.clientY);
    if (!find(id)?.liked) toggleLike(id);
    return;
  }
  lastTap = { id, at: now };
  clearTimeout(tapTimer);
  if (ui.view === 'post' && ui.params.id === id) return;
  tapTimer = setTimeout(() => openPost(id), 280);
}

const ACTIONS = {
  tab: (el) => switchTab(el.dataset.tab),
  back: () => back(),
  profile: (el) => openProfile(el.dataset.user),
  tag: (el) => go('tag', { tag: el.dataset.tag }),
  open: (el, event) => tapPost(el, event),
  like: (el) => toggleLike(el.dataset.id),
  repost: (el) => repostMenu(el.dataset.id),
  bookmark: (el) => toggleBookmark(el.dataset.id),
  more: (el) => moreMenu(el.dataset.id),
  vote: (el) => vote(el.dataset.id, Number(el.dataset.option)),
  reply(el) {
    if (ui.view === 'post' && ui.params.id === el.dataset.id) return document.getElementById('reply-text')?.focus();
    compose({ replyTo: el.dataset.id });
  },
  feed(el) {
    Object.assign(ui, { feed: el.dataset.feed, shown: PAGE, fresh: 0 });
    render();
  },
  fresh: () => showFresh(),
  'more-posts': () => showMore(),
  follow: (el) => toggleFollow(el.dataset.user),
  people: (el) => go('people', { list: el.dataset.list }),
  'profile-tab'(el) {
    ui.profileTab = el.dataset.tab;
    ui.shown = PAGE;
    rerender();
  },
  async 'profile-more'(el) {
    const handle = el.dataset.user;
    const muted = state.settings.mutedUsers.includes(handle);
    const choice = await sheet({ actions: [{ label: 'Envoyer un message', value: 'dm' }, { label: muted ? `Afficher @${handle}` : `Masquer @${handle}`, value: 'mute', danger: !muted }] });
    if (choice === 'dm') openChat(handle);
    else if (choice === 'mute') (muted ? unmuteUser : muteUser)(handle);
  },
  messages: () => go('messages'),
  chat: (el) => openChat(el.dataset.user, el.dataset.conv),
  'new-dm': () => newDm(),
  'send-dm': () => sendDm(),
  'send-reply': () => sendReply(),
  compose: () => compose(),
  publish: () => publish(),
  'cancel-compose': () => leaveCompose(),
  'toggle-palette'() {
    state.draft.palette = !state.draft.palette;
    if (state.draft.palette && state.draft.bg == null) state.draft.bg = 0;
    if (!state.draft.palette) state.draft.bg = null;
    rerender();
  },
  bg(el) {
    state.draft.bg = el.dataset.bg === '' ? null : Number(el.dataset.bg);
    rerender();
  },
  'toggle-poll'() {
    const d = state.draft;
    d.poll = d.poll ? null : { options: ['', ''], duration: 1 };
    if (d.poll) Object.assign(d, { bg: null, palette: false });
    rerender();
    if (d.poll) document.querySelector('[data-poll="0"]')?.focus();
  },
  'poll-add'() {
    state.draft.poll.options.push('');
    rerender();
    document.querySelector(`[data-poll="${state.draft.poll.options.length - 1}"]`)?.focus();
  },
  'poll-remove'(el) {
    state.draft.poll.options.splice(Number(el.dataset.option), 1);
    rerender();
  },
  'poll-duration'(el) {
    state.draft.poll.duration = Number(el.dataset.i);
    rerender();
  },
  insert: (el) => insertText(el.dataset.text),
  'mention-pick': (el) => insertText(`@${el.dataset.user} `, true),
  settings: () => go('settings'),
  'edit-profile'() {
    const p = online() && person(me());
    ui.edit = p ? { name: p.name, bio: p.note ?? p.bio } : { ...state.profile };
    go('edit');
  },
  'pick-emoji'(el) {
    ui.edit.emoji = el.dataset.emoji;
    rerender();
  },
  'pick-color'(el) {
    ui.edit.color = el.dataset.color;
    rerender();
  },
  'pick-cover'(el) {
    ui.edit.cover = Number(el.dataset.cover);
    rerender();
  },
  'save-profile'() {
    const e = ui.edit;
    const error = document.getElementById('e-error');
    const name = e.name.trim();
    if (online()) {
      if (!name) return void (error.textContent = 'Indiquez votre nom.');
      if (e.saving) return;
      e.saving = true;
      return api('/api/v1/accounts/update_credentials', { method: 'PATCH', body: { display_name: name, note: e.bio.trim() } })
        .then(({ data }) => {
          personFrom(data);
          if (ui.view === 'edit') back();
          snack('Profil enregistré');
        })
        .catch((failure) => {
          const box = document.getElementById('e-error');
          if (box) box.textContent = failure.message;
        })
        .finally(() => (e.saving = false));
    }
    const handle = e.handle.trim().toLowerCase().replace(/^@/, '');
    if (!name) return void (error.textContent = 'Indiquez votre nom.');
    const problem = handleProblem(handle, me());
    if (problem) return void (error.textContent = problem);
    const old = me();
    Object.assign(state.profile, { name, handle, bio: e.bio.trim().slice(0, MAX_BIO), place: (e.place || '').trim(), emoji: e.emoji, color: e.color, cover: e.cover });
    if (old !== handle) {
      for (const p of state.posts) if (p.author === old) p.author = handle;
      for (const entry of stack) if (entry.params.user === old) entry.params = { ...entry.params, user: handle };
    }
    changed();
    save('profile', 'posts');
    back();
    snack('Profil enregistré');
  },
  async 'mute-word'() {
    const word = (await orion.ui.prompt({ title: 'Masquer un mot', message: 'Les publications qui le contiennent n\'apparaîtront plus.', placeholder: 'Par exemple : spoiler' }))?.trim();
    if (!word) return;
    if (!state.settings.mutedWords.some((w) => fold(w) === fold(word))) state.settings.mutedWords.push(word.slice(0, 40));
    save('settings');
    changed();
    rerender();
  },
  'unmute-word'(el) {
    state.settings.mutedWords.splice(Number(el.dataset.i), 1);
    save('settings');
    changed();
    rerender();
  },
  'unmute-user': (el) => unmuteUser(el.dataset.user),
  erase: () => eraseAll(),
  'welcome-next'() {
    const name = document.getElementById('w-name').value.trim();
    const handle = document.getElementById('w-handle').value.trim().toLowerCase().replace(/^@/, '');
    const error = document.getElementById('w-error');
    if (!name) return void (error.textContent = 'Indiquez votre nom.');
    const problem = handleProblem(handle);
    if (problem) return void (error.textContent = problem);
    state.profile = { name, handle, bio: '', place: '', emoji: '', color: pick(COLORS), cover: Math.floor(Math.random() * GRADIENTS.length), since: Date.now(), pinned: null };
    ui.interests = new Set();
    ui.view = 'interests';
    render();
  },
  interest(el) {
    const id = el.dataset.id;
    if (!ui.interests.delete(id)) ui.interests.add(id);
    rerender();
  },
  start: () => startAgora(),
  'go-connect'() {
    ui.connectError = '';
    go('connect');
  },
  'pick-instance'(el) {
    ui.domain = el.dataset.domain;
    const input = document.getElementById('c-domain');
    if (input) input.value = ui.domain;
  },
  connect: () => startConnect(),
  disconnect: () => askDisconnect(),
  retry() {
    if (ui.view === 'messages') {
      fedi.convs = null;
      return render();
    }
    const key = currentKey();
    if (!key) return;
    load(key);
    rerender();
  },
  'more-remote'() {
    const key = currentKey();
    if (!key) return;
    load(key, { more: true });
    rerender();
  },
  cw(el) {
    ui.opened.add(el.dataset.id);
    refreshCards(el.dataset.id);
  },
  unveil(el) {
    ui.opened.add(`${el.dataset.id}:media`);
    refreshCards(el.dataset.id);
  },
  media(el) {
    const p = find(el.dataset.id);
    if (p?.sensitive && !ui.opened.has(`${p.id}:media`)) return ACTIONS.unveil(el);
    viewMedia(el.dataset.id, Number(el.dataset.i));
  },
};

$app.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (!el || !$app.contains(el) || el.disabled) return;
  const action = ACTIONS[el.dataset.act];
  if (action) action(el, event);
});

$app.addEventListener('input', (event) => {
  const t = event.target;
  if (t.id === 'q') {
    ui.query = t.value;
    refreshExplore();
  } else if (t.id === 'c-text') {
    state.draft.text = t.value;
    autosize(t);
    updateCompose();
    save('draft');
  } else if (t.dataset.poll != null) {
    state.draft.poll.options[Number(t.dataset.poll)] = t.value;
    updateCompose();
  } else if (t.id === 'w-name') {
    const handle = document.getElementById('w-handle');
    if (!handle.dataset.touched) handle.value = slug(t.value);
  } else if (t.id === 'w-handle') t.dataset.touched = '1';
  else if (t.id?.startsWith('e-')) ui.edit[t.id.slice(2)] = t.value;
  else if (t.tagName === 'TEXTAREA') autosize(t);
});

$app.addEventListener('change', (event) => {
  const key = event.target.dataset.setting;
  if (!key) return;
  const [group, name] = key.split('.');
  if (name) state.settings[group][name] = event.target.checked;
  else state.settings[group] = event.target.checked;
  save('settings');
  if (key === 'simulate') {
    if (state.settings.simulate) catchUp();
    else clearTimeout(simTimer);
  }
});

$app.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  const id = event.target.id;
  if (id === 'dm-text' && !event.shiftKey) {
    event.preventDefault();
    sendDm();
  } else if (id === 'reply-text' && !event.shiftKey) {
    event.preventDefault();
    sendReply();
  } else if (id === 'c-text' && (event.ctrlKey || event.metaKey) && !document.getElementById('publish').disabled) publish();
  else if (id === 'q') event.target.blur();
  else if (id === 'w-name' || id === 'w-handle') ACTIONS['welcome-next']();
  else if (id === 'c-domain') startConnect();
});

orion.onBack(() => {
  if (ui.viewer) closeViewer();
  else if (sheetDone) closeSheet(null);
  else if (ui.view === 'compose') leaveCompose();
  else if (ui.view === 'interests') {
    ui.view = 'welcome';
    render();
  } else return back();
  return true;
});
orion.on('pause', () => {
  paused = true;
  flush();
  arm();
  schedulePoll();
});
orion.on('resume', () => {
  paused = false;
  if (online()) return void pollInstance();
  if (!state.profile) return;
  catchUp();
  if (ui.view !== 'compose') rerender();
});

// ───────────── Démarrage ─────────────

const KEYS = ['profile', 'posts', 'follows', 'followers', 'notifs', 'dms', 'dmRead', 'bookmarks', 'settings', 'sim', 'draft'];
async function start() {
  const values = await Promise.all(KEYS.map((key) => orion.storage.get(key)));
  KEYS.forEach((key, i) => {
    if (values[i] != null) state[key] = values[i];
  });
  const s = state.settings || {};
  state.settings = { ...structuredClone(DEFAULT_SETTINGS), ...s, notify: { ...DEFAULT_SETTINGS.notify, ...s.notify } };
  state.sim = { queue: [], ambientAt: 0, lastRun: 0, cursor: {}, ...state.sim };
  for (const key of ['posts', 'follows', 'followers', 'notifs', 'bookmarks']) if (!Array.isArray(state[key])) state[key] = [];
  changed();
  ui.interests = new Set();
  const account = await orion.storage.get('fedi');
  if (account?.token && account.me) {
    fedi.account = account;
    ui.view = 'home';
    render();
    return goOnline();
  }
  if (!state.profile) {
    ui.view = 'welcome';
    return render();
  }
  ui.view = 'home';
  render();
  catchUp();
}

start().catch((error) => {
  $app.innerHTML = `<div class="empty"><b>Agora n'a pas pu démarrer</b><span>${esc(error.message)}</span></div>`;
});
</script>
